name: Daily Options Report

on:
  schedule:
    # 9:30 PM UTC = 4:30 PM ET (EST/winter) or 5:30 PM ET (EDT/summer)
    # Always 30+ min after NYSE close (4:00 PM ET), letting final volume settle
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # allow manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 for same-day snapshot restore

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore yesterday's snapshots if today's report already committed
        run: |
          # If the HEAD commit is today's automated report, restore the snapshot files
          # from the previous commit so the Python script always diffs against yesterday.
          TODAY=$(date -u +%Y-%m-%d)
          LAST_DATE=$(git log -1 --format="%ad" --date=short HEAD)
          LAST_MSG=$(git log -1 --format="%s" HEAD)
          if [ "$LAST_DATE" = "$TODAY" ] && echo "$LAST_MSG" | grep -q "update options report"; then
            echo "Today's report commit detected — restoring snapshots from HEAD~1"
            # Write to a temp file first so a failed git-show never truncates the original
            restore_file() {
              local src="$1" dst="$2"
              local tmp
              tmp=$(mktemp)
              if git show "HEAD~1:$src" > "$tmp" 2>/dev/null && [ -s "$tmp" ]; then
                mv "$tmp" "$dst"
                echo "  restored $src"
              else
                rm -f "$tmp"
                echo "  $src not found in HEAD~1, keeping existing"
              fi
            }
            restore_file reports/latest_analysis.json  reports/latest_analysis.json
            restore_file reports/weekly_analysis.json  reports/weekly_analysis.json
            restore_file reports/strike_history.json   reports/strike_history.json
          else
            echo "No same-day report commit found — running fresh against existing snapshots"
          fi

      - name: Generate options report
        run: python main.py

      - name: Copy latest HTML to docs/index.html
        run: |
          mkdir -p docs
          latest=$(ls -t reports/*.html | head -1)
          echo "Using: $latest"
          cp "$latest" docs/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html reports/latest_analysis.json reports/weekly_analysis.json reports/strike_history.json
          git add reports/options_signals_*.html reports/options_signals_*.xlsx
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update options report $(date +'%Y-%m-%d')" && git push
