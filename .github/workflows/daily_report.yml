name: Daily Options Report

on:
  schedule:
    # 9:30 PM UTC = 4:30 PM ET (EST/winter) or 5:30 PM ET (EDT/summer)
    # Always 30+ min after NYSE close (4:00 PM ET), letting final volume settle
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # allow manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate options report
        run: python main.py

      - name: Copy latest HTML to docs/index.html
        run: |
          mkdir -p docs
          latest=$(ls -t reports/*.html | head -1)
          echo "Using: $latest"
          cp "$latest" docs/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html reports/latest_analysis.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update options report $(date +'%Y-%m-%d')" && git push
